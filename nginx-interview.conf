# Interview stack locations, installed as /etc/nginx/snippets/muse-slop-interview.conf and
# included from the :443 server of /etc/nginx/sites-available/muse-slop.
#
#   /iv-admin/          admin app (its own login) on 127.0.0.1:18090
#   /m/<token>/...      Metabase on 127.0.0.1:13000. The token is regenerated on every stack
#                       start; nginx asks the admin app whether it is the current one
#                       (auth_request) and answers 404 otherwise. The prefix is stripped,
#                       Metabase knows it from MB_SITE_URL.
#   /iv-task/<token>/   the active sample's task for the candidate (rendered Markdown, served by
#                       the admin app, 404 unless the token is current and the stack is ready)

location = /iv-admin {
    return 301 /iv-admin/;
}

location /iv-admin/ {
    access_log off;
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
}

location /iv-task/ {
    access_log off;
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}

location ~ "^/m/[A-Za-z0-9_-]{16,64}$" {
    access_log off;
    return 302 $uri/;
}

location ~ "^/m/[A-Za-z0-9_-]{16,64}/" {
    access_log off;
    auth_request /_iv_mbcheck;
    error_page 401 403 =404 /_iv_gone;

    rewrite ^/m/[^/]+(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:13000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 600s;
    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /_iv_mbcheck {
    internal;
    access_log off;
    proxy_pass http://127.0.0.1:18090/_internal/mbcheck;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}

location = /_iv_gone {
    internal;
    access_log off;
    default_type text/plain;
    return 404 "Not found\n";
}
